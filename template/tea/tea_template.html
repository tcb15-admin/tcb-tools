<!DOCTYPE html>
<html lang="ja" data-cohort="{{COHORT_KEY}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>{{TEAM_NAME}} お茶当番</title>
<meta name="theme-color" content="#f3f3f5">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../tcb-shell.css">
<link rel="stylesheet" href="tea.css">
</head>
<body class="tea-body">
<svg width="0" height="0" class="tea-svg-defs" aria-hidden="true" focusable="false">
  <symbol id="tea-i-undo" viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5 7a8 8 0 1 1-1.2 4.5"/><path d="M5 7l4.2 1.2"/></symbol>
  <symbol id="tea-i-print" viewBox="0 0 24 24"><path d="M7 8V4h10v4"/><path d="M6 14H4a1 1 0 0 1-1-1v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/><path d="M8 17h8"/></symbol>
  <symbol id="tea-i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="tea-i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/><path d="M10 11v5M14 11v5"/></symbol>
</svg>

<header class="tea-hdr tcb-shell-hdr">
  <img class="tcb-shell-logo" src="../team-logo.png" width="42" height="42" alt="東海中央ボーイズ">
  <span class="tcb-shell-chip" aria-hidden="true">{{COHORT_LABEL}}</span>
  <h1>お茶当番<span>{{TEAM_NAME}} · 月次表／PDF展開</span></h1>
  <a class="tea-hdr-link tcb-shell-link" href="../portal/">ポータル</a>
</header>

<div id="tea-pw" class="tea-pw">
  <div class="tea-pw-card">
    <h2>お茶当番ログイン</h2>
    <input id="tea-pw-inp" type="password" placeholder="パスワード" autocomplete="current-password">
    <button type="button" id="tea-pw-btn" class="tea-btn tea-btn-primary" style="width:100%">ログイン</button>
    <p id="tea-pw-err" class="tea-status err"></p>
  </div>
</div>

<main class="tea-wrap" id="tea-main">
  <nav class="tea-flow tea-no-print" aria-label="お茶当番MGRの作業の流れ">
    <button type="button" class="tea-flow-btn is-active" data-tea-flow="make" id="tea-flow-make">
      <span class="tea-flow-num">1</span>
      <span class="tea-flow-lab">当番表をつくる</span>
    </button>
    <button type="button" class="tea-flow-btn" data-tea-flow="share" id="tea-flow-share">
      <span class="tea-flow-num">2</span>
      <span class="tea-flow-lab">PDFで展開</span>
    </button>
    <button type="button" class="tea-flow-btn" data-tea-flow="change" id="tea-flow-change">
      <span class="tea-flow-num">3</span>
      <span class="tea-flow-lab">変更を反映</span>
    </button>
  </nav>
  <p id="tea-flow-hint" class="tea-flow-hint tea-no-print">前月から作成 → 内容確認 → 保存。そのあと「PDFで展開」へ。</p>

  <section class="tea-card tea-card-main" id="tea-panel-table">
    <div class="tea-toolbar tea-no-print" role="navigation" aria-label="月の切替と操作">
      <button type="button" id="tea-ym-prev" class="tea-btn tea-btn-ghost">◀</button>
      <button type="button" id="tea-ym-now" class="tea-btn tea-btn-ghost">当月</button>
      <button type="button" id="tea-ym-next" class="tea-btn tea-btn-ghost">▶</button>
      <input id="tea-ym" type="month" required aria-label="対象月">
      <span id="tea-ym-label" class="tea-ym-label"></span>
      <span class="tea-toolbar-gap"></span>
      <button type="button" id="tea-btn-from-prev" class="tea-btn tea-btn-ghost">前月から作成</button>
      <button type="button" id="tea-btn-add-day" class="tea-btn tea-btn-ico tea-btn-ghost" title="日付を1行追加" aria-label="日付を1行追加">
        <svg viewBox="0 0 24 24"><use href="#tea-i-plus"/></svg>
      </button>
      <button type="button" id="tea-btn-undo-swap" class="tea-btn tea-btn-ico tea-btn-ghost" disabled title="交代を戻す" aria-label="交代を戻す">
        <svg viewBox="0 0 24 24"><use href="#tea-i-undo"/></svg>
      </button>
      <button type="button" id="tea-btn-save" class="tea-btn tea-btn-primary">保存</button>
      <button type="button" id="tea-btn-print" class="tea-btn tea-btn-ico tea-btn-ghost" title="印刷" aria-label="印刷">
        <svg viewBox="0 0 24 24"><use href="#tea-i-print"/></svg>
      </button>
    </div>

    <p id="tea-month-badge" class="tea-meta tea-no-print"></p>

    <p class="tea-print-only tea-print-title" id="tea-print-title"></p>
    <div class="tea-tbl-wrap" id="tea-print-area">
      <table class="tea-tbl" id="tea-day-tbl">
        <thead>
          <tr>
            <th style="width:118px">日付</th>
            <th style="width:36px">曜</th>
            <th>当番A</th>
            <th>当番B</th>
            <th style="width:88px">選手班</th>
            <th class="tea-no-print" style="width:44px"></th>
          </tr>
        </thead>
        <tbody id="tea-day-body"></tbody>
      </table>
    </div>

    <div class="tea-foot-row">
      <input id="tea-revised" class="tea-revised-inp" maxlength="40" placeholder="更新表記 例: 2026.8.11更新" aria-label="更新表記">
      <p id="tea-revised-foot" class="tea-revised-foot"></p>
    </div>
    <details class="tea-details tea-no-print">
      <summary>メモ</summary>
      <textarea id="tea-note" maxlength="500" placeholder="注意書きなど" rows="2"></textarea>
    </details>
  </section>

  <section class="tea-card tea-no-print tea-card-compact" id="tea-panel-share">
    <h2>PDFで展開</h2>
    <p class="tea-hint">印刷ダイアログで「PDFに保存」し、そのファイルを MG LINE に添付して展開します。テキスト貼り付けは使いません。</p>
    <div class="tea-row">
      <button type="button" id="tea-btn-share-print" class="tea-btn tea-btn-primary">
        <svg class="tea-btn-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tea-i-print"/></svg>
        印刷してPDF保存
      </button>
    </div>
  </section>

  <details class="tea-card tea-details-card tea-no-print" id="tea-panel-groups">
    <summary class="tea-card-sum">選手班名簿<span class="tea-sum-note">固定・退部などのときだけ修正</span></summary>
    <p class="tea-hint">未割当の選手を班へ振り分けます。1人は1班のみです。</p>
    <div class="tea-groups" id="tea-groups"></div>
    <div class="tea-row" style="margin-top:8px">
      <button type="button" id="tea-btn-save-groups" class="tea-btn tea-btn-primary">選手班を保存</button>
    </div>
  </details>

  <details class="tea-card tea-details-card tea-no-print">
    <summary class="tea-card-sum">補充品目マスタ</summary>
    <div id="tea-supply-edit" class="tea-supply-list"></div>
    <div class="tea-row" style="margin-top:8px">
      <button type="button" id="tea-supply-add" class="tea-btn tea-btn-ghost">品目追加</button>
      <button type="button" id="tea-supply-save" class="tea-btn tea-btn-primary">品目を保存</button>
    </div>
  </details>

  <details class="tea-card tea-details-card tea-no-print">
    <summary class="tea-card-sum">パスワード変更</summary>
    <div class="tea-row">
      <div class="tea-field"><label for="tea-pw-new">新しいパスワード</label><input id="tea-pw-new" type="password" autocomplete="new-password"></div>
      <div class="tea-field"><label for="tea-pw-new2">確認</label><input id="tea-pw-new2" type="password" autocomplete="new-password"></div>
    </div>
    <button type="button" id="tea-pw-change" class="tea-btn tea-btn-ghost">パスワードを変更</button>
  </details>

  <p id="tea-status" class="tea-status"></p>
</main>

<script>
window.TCB_TEA_CFG={
  cohort:{{COHORT_KEY_JSON}},
  apiBase:{{SYNC_API_BASE_URL_JSON}},
  apiToken:{{SYNC_API_TOKEN_JSON}},
  initialPw:{{INITIAL_PW_JSON}},
  lsPrefix:{{LS_PREFIX_JSON}},
  teamName:{{TEAM_NAME_JSON}}
};
</script>
<script src="../tcb-sync-api.js"></script>
<script src="../attendance/attendance-jp-calendar.js"></script>
<script src="tea-line.js"></script>
<script src="tea-seed-2026-08.js"></script>
<script src="tea-app.js"></script>
</body>
</html>
