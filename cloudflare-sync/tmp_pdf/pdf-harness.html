<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PDF出力検証ハーネス</title>
<script src="../../boys15/jspdf.umd.min.js"></script>
<script src="../../boys15/html2canvas.min.js"></script>
<script src="../../boys15/html2pdf.min.js"></script>
<script src="../../boys15/tcb-print-pdf.js"></script>
<style>body{font-family:sans-serif;margin:10px;}#pdfview{width:640px;height:900px;border:1px solid #999;}</style>
</head>
<body>
<h3>担当表PDF生成テスト（試合組13名／練習組7名・4列）</h3>
<div id="status">生成中…</div>
<iframe id="pdfview" title="pdf"></iframe>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function card(name, tools){
  var items=tools.map(function(t){
    return '<div class="tool-item"><span class="tool-name" style="font-size:11px">'+esc(t[0])+'</span>'
      +(t[1]?'<div class="tool-desc" style="font-size:8px">'+esc(t[1])+'</div>':'')+'</div>';
  }).join('');
  return '<div class="card prA"><div class="card-body"><div class="person-name">'+esc(name)+'</div><div class="tool-list">'+items+'</div></div></div>';
}
function buildSample(){
  var css=[
    '*{box-sizing:border-box;margin:0;padding:0;}',
    'html,body{margin:0;padding:0;width:210mm;min-height:auto;height:auto;max-height:none;overflow:visible;font-family:sans-serif;background:#fff;}',
    '.page{width:100%;min-height:auto;height:auto;max-height:none;display:flex;flex-direction:column;overflow:visible;box-sizing:border-box;}',
    '.header{background:#122050;color:#fff;border-radius:6px;padding:10px 14px;margin-bottom:10px;}',
    '.header h1{font-size:14px;font-weight:900;}',
    '.gh{font-size:11px;font-weight:900;padding:4px 12px;border-radius:4px;margin:5px 0;}',
    '.ghA{background:#e3f2fd;color:#1565c0;border-left:3px solid #1565c0;}',
    '.ghB{background:#f3e5f5;color:#6a1b9a;border-left:3px solid #6a1b9a;}',
    '.tcb-print-team-stack{display:flex;flex-direction:column;gap:10px;width:100%;overflow:visible;}',
    '.tcb-print-team-section{display:flex;flex-direction:column;overflow:visible;width:100%;}',
    '.tcb-print-team-cards,.cards{display:grid;gap:6px;grid-auto-rows:auto;align-content:start;overflow:visible;}',
    '.tcb-print-cols-4.tcb-print-team-cards{grid-template-columns:repeat(4,minmax(0,1fr));}',
    '.card{background:#fff;border-radius:5px;overflow:hidden;border:1px solid #e0e0e0;border-left:3px solid #cfd8dc;display:flex;flex-direction:column;}',
    '.card-body{padding:7px 9px;flex:1;display:flex;flex-direction:column;overflow:hidden;}',
    '.prA{border-left-color:#1565c0;}',
    '.person-name{font-size:13px;font-weight:900;color:#1a2e45;margin-bottom:5px;border-bottom:1px solid #e0e0e0;padding-bottom:3px;}',
    '.tool-list{flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden;}',
    '.tool-item{display:flex;flex-direction:column;gap:2px;line-height:1.35;width:100%;}',
    '.tool-item+.tool-item{margin-top:6px;padding-top:5px;border-top:1px dashed #eceff1;}',
    '.tool-name{font-weight:800;color:#c62828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}',
    '.tool-desc{font-weight:400;color:#546e7a;line-height:1.45;white-space:normal;word-break:break-word;width:100%;}',
    'html.tcb-pdf-export,html.tcb-pdf-export body{height:auto!important;max-height:none!important;overflow:visible!important;}',
    'html.tcb-pdf-export .page{height:auto!important;max-height:none!important;overflow:visible!important;}',
    'html.tcb-pdf-export .tcb-print-team-cards,html.tcb-pdf-export .cards{overflow:visible!important;max-height:none!important;}',
    'html.tcb-pdf-export .card,html.tcb-pdf-export .card-body,html.tcb-pdf-export .tool-list{overflow:visible!important;max-height:none!important;}',
    'html.tcb-pdf-export .tool-name{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;}'
  ].join('');
  var descA='チーム所有タープCAPTAINSTAG（青）ケース付き長めの説明文テスト';
  var descB='ボール12球、ロジン、ホームベース×1、メジャー×1、予備ボール多数';
  var descC='球審用グッズ（マスク・プロテクター・レガース・ボールバッグ）※球数カウンターあり';
  /* 人数は ?n= で可変（既定26）。人数変動時のレイアウト耐性テスト用 */
  var N=parseInt(new URLSearchParams(location.search).get('n')||'26',10);
  document.querySelector('h3').textContent='担当表PDF生成テスト（練習組'+N+'名・4列）';
  var A=[];
  var B=[];
  var names=['遠藤','大脇','本山','伊藤','半田','長坂','高橋','丸井','伊藤','三浦','神野','清水','柴田','秋田','松原','林','岡村','見並','鵜飼','鮫島','池田','増田','榎本','ディグ','植松','伊郷'];
  for(var j=0;j<N;j++){
    var tools=[['タープ ⑤',descA],['雑カゴ ②','メッシュコンテナ×1つ、買い物カゴ×2つ']];
    if(j%4===0)tools.push(['審判道具 ②',descC]);
    B.push(card((j+1)+'：'+(names[j%26]||('選手'+(j+1))),tools));
  }
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>'+css+'</style></head><body>'
    +'<div class="page">'
    +'<div class="header"><h1>【東海中央 チーム道具持帰り担当】テスト</h1></div>'
    +'<div class="tcb-print-team-stack">'
    +'<div class="tcb-print-team-section"><div class="gh ghA">試合組グループ（0名）</div><div class="tcb-print-team-cards tcb-print-cols-4"></div></div>'
    +'<div class="tcb-print-team-section"><div class="gh ghB">練習組グループ（'+N+'名）</div><div class="tcb-print-team-cards tcb-print-cols-4">'+B.join('')+'</div></div>'
    +'</div></div></body></html>';
}
window.addEventListener('load',function(){
  var html=buildSample();
  TCB_generateAssignPdfBlob(html).then(function(blob){
    document.getElementById('status').textContent='生成OK（'+Math.round(blob.size/1024)+' KB）';
    document.getElementById('pdfview').src=URL.createObjectURL(blob)+'#toolbar=0';
    var fr=new FileReader();
    fr.onload=function(){window.__pdfDataURL=fr.result;window.__pdfOk=true;};
    fr.readAsDataURL(blob);
  }).catch(function(err){
    document.getElementById('status').textContent='失敗: '+(err&&err.message||err);
    window.__pdfOk=false;
  });
});
</script>
</body>
</html>
